<section class="admin section" id="adminPanel">

    <div class="container">

        <div class="section-heading">

            <p class="section-subtitle">
                MANAGEMENT
            </p>

            <h2>
                Admin <span>Panel</span>
            </h2>

        </div>


        <div class="admin-login" id="adminLogin">

            <h3>Admin Login</h3>

            <input
                type="email"
                id="adminUsername"
                placeholder="Admin email"
                autocomplete="username">

            <input
                type="password"
                id="adminPassword"
                placeholder="Password"
                autocomplete="current-password">

            <button id="loginBtn">
                Login
            </button>

            <p id="loginMessage"></p>

        </div>


        <div
            class="admin-dashboard"
            id="adminDashboard"
            style="display:none;">

            <h3>Dashboard</h3>

            <p class="admin-storage" id="adminStorageStatus"></p>

            <div class="dashboard-cards">

                <div class="dashboard-card">
                    <h4>Products</h4>
                    <p id="productCount">0</p>
                </div>

                <div class="dashboard-card">
                    <h4>Wishlist</h4>
                    <p id="adminWishlistCount">0</p>
                </div>

                <div class="dashboard-card">
                    <h4>Favorites</h4>
                    <p id="adminFavoriteCount">0</p>
                </div>

            </div>


            <!-- ADD PRODUCT FORM -->
            <div class="admin-product-form">

                <h3>Add New Product</h3>

                <label class="admin-field" for="newProductName">
                    <span>Product name</span>
                    <input
                        type="text"
                        id="newProductName"
                        placeholder="e.g. K 6210 Statuario"
                        autocomplete="off">
                </label>

                <label class="admin-field" for="newProductDescription">
                    <span>Description</span>
                    <textarea
                        id="newProductDescription"
                        placeholder="Finish, size, usage..."></textarea>
                </label>

                <label class="admin-field" for="newProductPrice">
                    <span>Price per sq.ft (leave empty for "Price on Request")</span>
                    <input
                        type="number"
                        id="newProductPrice"
                        placeholder="e.g. 2500"
                        min="1">
                </label>

                <label class="admin-field" for="newProductCategory">
                    <span>Category</span>
                    <select id="newProductCategory">
                        <option value="MARBLE">Marble</option>
                        <option value="PORCELAIN">Porcelain</option>
                        <option value="CERAMIC">Ceramic</option>
                        <option value="VITRIFIED">Vitrified</option>
                    </select>
                </label>

                <label class="admin-field" for="newProductImage">
                    <span>Product image (JPG, PNG, WebP or AVIF)</span>
                    <input
                        type="file"
                        id="newProductImage"
                        accept="image/jpeg,image/png,image/webp,image/avif">
                </label>

                <div class="admin-image-preview" id="imagePreview" hidden>
                    <img id="imagePreviewImg" alt="Selected product image">
                </div>

                <p class="admin-hint" id="imageStatus"></p>

                <button type="button" id="addProductBtn">
                    Add Product
                </button>

                <p id="productMessage"></p>

            </div>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

    </div>

</section>
