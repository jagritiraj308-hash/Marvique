<section class="featured section" id="featured">

    <div class="container">

        <div class="section-heading">

            <p class="section-subtitle">
                OUR COLLECTION
            </p>

            <h2>
                Featured <span>Collections</span>
            </h2>

            <p>
                Carefully selected surfaces crafted to bring
                elegance, character and lasting beauty to every space.
            </p>

        </div>


        <div class="collection-toolbar">

            <div
                class="collection-filters"
                id="collectionFilters"
                role="group"
                aria-label="Filter products by category">

                <button
                    type="button"
                    class="filter-chip is-active"
                    data-filter="all">
                    All
                </button>

            </div>

            <label class="collection-search" for="productSearch">
                <span class="sr-only">Search products</span>
                <input
                    type="search"
                    id="productSearch"
                    placeholder="Search products…"
                    autocomplete="off">
            </label>

        </div>

        <p class="collection-count" id="collectionCount" aria-live="polite"></p>


        <div class="featured-grid" id="featuredGrid">

            <p class="collection-loading">Loading products…</p>

        </div>

        <p class="collection-empty" id="collectionEmpty" hidden>
            No products match your search. Try a different keyword or category.
        </p>

    </div>

</section>
