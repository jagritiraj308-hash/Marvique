<section class="wishlist section" id="wishlist">

    <div class="container">

        <div class="section-heading">

            <p class="section-subtitle">
                YOUR SAVED PRODUCTS
            </p>

            <h2>
                My <span>Wishlist</span>
            </h2>

            <p>
                Keep your favourite surfaces in one place and
                compare them when you visit the showroom.
            </p>

        </div>

        <div
            id="wishlistGrid"
            class="featured-grid saved-products"
            aria-live="polite">
        </div>

        <div class="wishlist-empty" id="wishlistEmpty" hidden>

            <p>Your wishlist is empty.</p>

            <a href="#featured" class="btn primary-btn">
                Browse Collection
            </a>

        </div>

        <button id="clearWishlist" class="clear-btn" type="button" hidden>
            Clear Wishlist
        </button>

    </div>

</section>
